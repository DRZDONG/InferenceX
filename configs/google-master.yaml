  model: google/gemma-4-26B-A4B-it
  model-prefix: gemma4moe
  runner: tpuv6e8
  precision: bf16
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 1024
      osl: 1024
      search-space:
      # - { tp: 2, ep: 4, conc-start: 1, conc-end: 128 }
      # - { tp: 4, ep: 2, conc-start: 1, conc-end: 128 }
      - { tp: 4, conc-start: 1, conc-end: 128 }
      - { tp: 8, conc-start: 1, conc-end: 128 }
    - isl: 8192
