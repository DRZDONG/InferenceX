    fixed-seq-len:
    - isl: 1024
      osl: 1024
      search-space:
      - { tp: 8, ep: 8, dp-attn: true, conc-start: 4, conc-end: 256 }
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 8, ep: 8, dp-attn: true, conc-start: 4, conc-end: 256 }

# Disaggregated prefill/decode + host-DRAM KV offload (PR #2019) for qwen3.5 on TPU v7.
# Modeled as a multinode/disagg entry so process_result.py normalizes per-GPU across the
# prefill+decode engines. Each point = prefill (TP=8) + decode (TP=8) on two tpu7x hosts +
# a proxy; the GKE disagg launcher (runners/launch_tpuv7-disagg-gke.sh) serves once at
# max-num-seqs=max(conc) and benches each conc through the proxy. dp-attn MUST be false
# (the DP scheduler crashes on the disagg KV-transfer-finished callback). Canary: conc 4/32/256.
qwen3.5-fp8-tpuv7-disagg-vllm:
  image: vllm/vllm-tpu:nightly
  model: Qwen/Qwen3.5-397B-A17B-FP8
  model-prefix: qwen3.5
  runner: tpuv7
  precision: fp8
  framework: vllm
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 1024
      osl: 1024
      search-space:
      - spec-decoding: "none"
        conc-list: [4, 8, 16, 32, 64, 128, 256]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: false
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: false
    - isl: 8192
      osl: 1024
      search-space:
      - spec-decoding: "none"
        conc-list: [4, 8, 16, 32, 64, 128, 256]
        prefill:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: false
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: false
