      # - { tp: 2, ep: 4, conc-start: 1, conc-end: 128 }
      # - { tp: 4, ep: 2, conc-start: 1, conc-end: 128 }
      - { tp: 4, conc-start: 1, conc-end: 128 }
      - { tp: 8, conc-start: 1, conc-end: 128 }

gemma4moe-mtp-bf16-tpuv6e8-vllm:
  # MTP (gemma4_assistant drafter) needs a vLLM-TPU build newer than the :gemma4
  # tag, which predates gemma4 MTP support (PR vllm#41745 / newer Transformers).
  image: vllm/vllm-tpu:nightly-20260606-9006eb6-063ce98
  model: google/gemma-4-26B-A4B-it
  model-prefix: gemma4moe
  runner: tpuv6e8
  precision: bf16
  framework: vllm
  multinode: false
  # MTP (multi-token prediction) speculative decoding via Google's
  # gemma-4-26B-A4B-it-assistant drafter (see *_tpuv6e8_mtp.sh).
  scenarios:
    fixed-seq-len:
    - isl: 1024
      osl: 1024
      search-space:
      - { tp: 4, conc-start: 1, conc-end: 128, spec-decoding: mtp }
      - { tp: 8, conc-start: 1, conc-end: 128, spec-decoding: mtp }
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 4, conc-start: 1, conc-end: 128, spec-decoding: mtp }
      - { tp: 8, conc-start: 1, conc-end: 128, spec-decoding: mtp }

