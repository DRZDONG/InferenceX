gptoss-bf16-tpuv6e8-vllm:
  image: vllm/vllm-tpu:v0.13.2
  model: unsloth/gpt-oss-20b-BF16
  model-prefix: gptoss-20b
  runner: tpuv6e8
  precision: bf16
  framework: vllm
  multinode: false
  scenarios:
    fixed-seq-len:
    - isl: 1024
      osl: 1024
      search-space:
      - { tp: 2, conc-start: 4, conc-end: 128 }
      - { tp: 4, conc-start: 4, conc-end: 64 }
      - { tp: 8, conc-start: 4, conc-end: 16 }
    - isl: 8192
      osl: 1024
      search-space:
      - { tp: 2, conc-start: 4, conc-end: 64 }
      - { tp: 4, conc-start: 4, conc-end: 32 }
      - { tp: 8, conc-start: 4, conc-end: 32 }

gemma4moe-bf16-tpuv6e8-vllm:
